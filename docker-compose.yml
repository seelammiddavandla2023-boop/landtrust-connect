# One-command demonstration environment.
#
#   docker compose up --build
#
# API on :8000, UI on :3000. Useful when the review room has no internet and the
# hosted demonstration is unreachable.
services:
  api:
    build:
      # Repository root, not ./backend: backend/Dockerfile copies backend/requirements.txt
      # and expects the repository's directory layout, the same way Render builds it.
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 1 includes the OCR arm of the evaluation in the image (~44 s on a normal
        # machine, far longer on a throttled VM). See backend/Dockerfile.
        EVAL_OCR: "0"
    ports:
      - "8000:8000"
    environment:
      # SQLite by default. To use PostgreSQL, uncomment the db service below and set:
      # DATABASE_URL: postgresql+psycopg://landtrust:landtrust@db:5432/landtrust
      EXTRACTION_MODE: DEMO
      CORS_ORIGINS: "*"
    # No volume is mounted on /app/data by design. The image is built with the corpus
    # rendered, the evaluation run and the database seeded, so the container starts in
    # a known state and /research is populated. Mounting a host directory here would
    # hide all three and leave the Research Results page empty. Uncomment only if you
    # want uploads to survive `docker compose down`:
    # volumes:
    #   - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Reachable from the browser, not from inside the compose network: lib/api.ts
      # calls the API from the user's browser, where "api" does not resolve.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  # Optional PostgreSQL. The schema is identical; no migration is required.
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: landtrust
  #     POSTGRES_PASSWORD: landtrust
  #     POSTGRES_DB: landtrust
  #   ports: ["5432:5432"]
