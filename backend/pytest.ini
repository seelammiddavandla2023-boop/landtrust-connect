[pytest]
testpaths = tests
addopts = -q

# Keep pytest's cache off the project directory.
#
# On Windows the repository is often on a synced or mounted folder (OneDrive, a
# mapped drive, or the Linux-VM view of C:\). Those filesystems do not implement
# the permission calls pytest's cache plugin makes, and the failure surfaces as a
# RecursionError from tempfile rather than anything resembling the real cause.
cache_dir = /tmp/.pytest_cache_landtrust

filterwarnings =
    ignore::DeprecationWarning:swig.*
